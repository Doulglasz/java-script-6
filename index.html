<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="box">
        <h1 id="titulo">Texto Original</h1>
        <button id="btnMudar">Mudar Título</button>
    </div>
    <div class="box">
        <h2>Contador: <span id="contador">0</span></h2>
        <button id="btnIncrementar">Incrementar</button>
    </div>
    <div class="box">
        <p class="paragrafo">Parágrafo 1</p>
        <p class="paragrafo">Parágrafo 2</p>
        <button id="btnDestacar">Destacar Parágrafos</button>
    </div>
    <div class="box">
        <input type="text" id="campoInput" placeholder="Digite algo aqui...">
        <p>Você está digitando: <span id="textoRefletido"></span></p>
    </div>


    <div class="caixa">
        <div>
            <div>
                <input type="number" id="num1" placeholder="Digite um valor">
            </div>
            <div>
                <input type="number" id="num2" placeholder="Digite um valor">
            </div>
        </div>
        <div>
            <div>
                <button id="btnSoma">+</button>
            </div>
            <div>
                <button id="btnSub">-</button>
            </div>
            <div>
                <button id="btnMulti">X</button>
            </div>
            <div>
                <button id="btnDiv">/</button>
            </div>
            <div class="resultado">
                <span id="resultado">=</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
